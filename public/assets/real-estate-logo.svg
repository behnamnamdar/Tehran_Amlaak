    <rect x="174" y="252" width="64" height="26" fill="#ecf7f9" rx="1" />
    <rect x="176" y="254" width="60" height="22" fill="#1e2a2c" />
    <!-- 4 Windows -->
    <rect x="178" y="256" width="12" height="18" fill="#36c2bb" />
    <rect x="193" y="256" width="12" height="18" fill="#36c2bb" />
    <rect x="208" y="256" width="12" height="18" fill="#36c2bb" />
    <rect x="223" y="256" width="12" height="18" fill="#36c2bb" />

    <!-- Windows Mullions -->
    <line x1="184" y1="256" x2="184" y2="274" stroke="#1e2a2c" stroke-width="1.2" />
    <line x1="178" y1="262" x2="190" y2="262" stroke="#1e2a2c" stroke-width="1.2" />
    <line x1="199" y1="256" x2="199" y2="274" stroke="#1e2a2c" stroke-width="1.2" />
    <line x1="193" y1="262" x2="205" y2="262" stroke="#1e2a2c" stroke-width="1.2" />
    <line x1="214" y1="256" x2="214" y2="274" stroke="#1e2a2c" stroke-width="1.2" />
    <line x1="208" y1="262" x2="220" y2="262" stroke="#1e2a2c" stroke-width="1.2" />
    <line x1="229" y1="256" x2="229" y2="274" stroke="#1e2a2c" stroke-width="1.2" />
    <line x1="223" y1="262" x2="235" y2="262" stroke="#1e2a2c" stroke-width="1.2" />

    <!-- Intermediate Window (Between Garage and Center) -->
    <rect x="142" y="253" width="14" height="18" fill="#1e2a2c" />
    <rect x="144" y="255" width="10" height="14" fill="#36c2bb" />
    <line x1="149" y1="255" x2="149" y2="269" stroke="#1e2a2c" stroke-width="1" />
    <line x1="144" y1="262" x2="154" y2="262" stroke="#1e2a2c" stroke-width="1" />

    <!-- RIGHT GABLE (Right Wing) -->
    <!-- Right Roof Fascia White Trim -->
    <polygon points="252,228 306,188 360,228 353,234 306,198 259,234" fill="#ecf7f9" />
    <polygon points="255,230 306,192 357,230 353,234 306,198 259,234" fill="#6ecad0" />
    <!-- Right Gable Wall -->
    <polygon points="260,230 306,196 350,230 350,290 260,290" fill="#2d3f42" />

    <!-- Right Wing Windows -->
    <!-- Window 1 -->
    <rect x="268" y="253" width="16" height="19" fill="#1e2a2c" />
    <rect x="270" y="255" width="12" height="15" fill="#36c2bb" />
    <line x1="276" y1="255" x2="276" y2="270" stroke="#1e2a2c" stroke-width="1" />
    <line x1="270" y1="262" x2="282" y2="262" stroke="#1e2a2c" stroke-width="1" />

    <!-- Window 2 (Far Right Window / Door) -->
    <rect x="300" y="248" width="16" height="26" fill="#1e2a2c" />
    <rect x="302" y="250" width="12" height="22" fill="#36c2bb" />
    <line x1="308" y1="250" x2="308" y2="272" stroke="#1e2a2c" stroke-width="1" />
    <line x1="302" y1="258" x2="314" y2="258" stroke="#1e2a2c" stroke-width="1" />

    <!-- GROUND BASELINE (Charcoal Ground Bar) -->
    <rect x="42" y="290" width="316" height="11" fill="#233133" rx="2" />
  </g>
</svg>
